services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: router
      POSTGRES_PASSWORD: router
      POSTGRES_DB: router
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U router"]
      interval: 2s
      retries: 30

  api:
    build: .
    ports:
      - "${API_PORT:-8101}:8000"
    environment:
      MOCK_MODE: ${MOCK_MODE:-1}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      DATABASE_URL: postgresql://router:router@db:5432/router
      MONTHLY_BUDGET_USD: ${MONTHLY_BUDGET_USD:-50}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
