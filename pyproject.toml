[project]
name = "llm-model-router"
version = "1.0.0"
description = "Route LLM queries to cheap/mid/expert models under a monthly budget."
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "anthropic>=1.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pyyaml>=6",
    "scikit-learn>=1.5",
    "numpy>=1.26",
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
eval = ["matplotlib>=3.8"]
dev = ["pytest>=8", "ruff>=0.6", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["router"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B905"]

[tool.pytest.ini_options]
testpaths = ["tests"]
